[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myth-grt"
version = "2.0.0"
description = "A world-simulation game where language shapes reality, narrated by Claude."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marc \"Nova\" Jenkins" }]
dependencies = [
    "anthropic>=2.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
myth-grt = "myth_grt.cli:main"

[tool.setuptools]
packages = ["myth_grt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
